[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalip"
version = "1.0.1"
description = "Linux icin imaj yazici"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Orkun Soylu", email = "103385766+orkun-soylu@users.noreply.github.com" }]

[project.scripts]
kalip = "kalip.app:main"

[tool.setuptools]
packages = ["kalip", "kalip.ui"]
